# 52-atem-audio-ignore.conf  (WirePlumber 0.5 format; ported 2026-10-04 from
# 52-atem-audio-ignore.lua, which 0.5 silently ignores — until this port PipeWire
# was claiming the ATEM's audio card again)
#
# ATEM Mini Extreme's own audio interface (card "Extreme") must stay off
# PipeWire entirely. ffmpeg-capture.service reads ATEM audio directly via ALSA
# plughw:Extreme,0 (Pulse/PipeWire capture is unreliable with FFmpeg for this
# device). Nothing uses the ATEM's audio through PipeWire/Ardour/qpwgraph — unlike
# the PreSonus card, there is no legitimate PipeWire consumer to protect here.
#
# Root-caused 2026-08-02: after a reboot, PipeWire's ALSA monitor claimed
# /dev/snd/pcmC1D0c before ffmpeg-capture.service could open it, so ffmpeg's direct
# ALSA open failed with "Device or resource busy" and the unit crash-looped.
# device.disabled is safe here (unlike PreSonus — see 51-presonus-soft-mixer.conf).
# 0.5's monitors/alsa.lua still honours device.disabled after rules are applied.
#
# Install: ~/.config/wireplumber/wireplumber.conf.d/   (installer does this)
# Apply:   systemctl --user restart wireplumber, then restart ffmpeg-capture/-display
#          — NOT mid-service.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Blackmagic_Design_ATEM_Mini_Extreme*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
