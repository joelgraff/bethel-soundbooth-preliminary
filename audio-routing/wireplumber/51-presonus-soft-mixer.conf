# 51-presonus-soft-mixer.conf  (WirePlumber 0.5 format; ported 2026-10-04 from
# 51-presonus-soft-mixer.lua, which 0.5 silently ignores)
#
# PreSonus StudioLive 32SX: full USB is 64ch S32_LE (pro-audio / multichannel).
# That is normal and required for Ardour multitrack + qpwgraph.
#
# Problem we hit: ACP "HARDWARE DECIBEL_VOLUME" on the *playback* sink can report
# channel volumes at 0%/-inf so Mixer->AUX0/1 links look live but FOH is silent.
# api.alsa.soft-mixer forces software gain so levels can be set.
#
# Do NOT set device.disabled — that hides the card from PipeWire and blocks
# Ardour/qpwgraph (2026-08-02 mistake). FOH uses Mixer->playback_AUX0/1 links;
# exclusive ALSA aplay bridge is fallback only, not default.
#
# Install: ~/.config/wireplumber/wireplumber.conf.d/   (installer does this)
# Apply:   systemctl --user restart wireplumber  — NOT mid-service: ffplay's audio
#          falls back to Mixer/FOH while WirePlumber is down (see SYSTEM-STATE).

monitor.alsa.rules = [
  # The card (device) ...
  {
    matches = [
      {
        device.name = "~alsa_card.usb-PreSonus*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        api.alsa.ignore-dB  = true
      }
    }
  }
  # ... and its PCM nodes once created (pro-audio / multichannel)
  {
    matches = [
      {
        node.name = "~alsa_output.usb-PreSonus*"
      }
      {
        node.name = "~alsa_input.usb-PreSonus*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        api.alsa.ignore-dB  = true
      }
    }
  }
]
