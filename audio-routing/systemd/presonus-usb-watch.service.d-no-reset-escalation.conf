# Disable the USB reset escalation, 2026-09-05 08:14, before the 2pm wedding.
#
# The reset was built to recover the wedged-but-attached failure unattended.
# Tested twice against that exact signature and it did not recover it either
# time; on the second attempt (08:09) it took the device from "present but
# dead" to "not enumerating at all", and it did not come back without a
# power-cycle. Against this failure mode it is strictly downside.
#
# Re-enable by removing this file when there is time to test it against the
# OTHER signature (spontaneous disconnect / failed re-enumeration), which a
# port reset still has a plausible chance of clearing.
#   rm ~/.config/systemd/user/presonus-usb-watch.service.d/no-reset-escalation.conf
#   systemctl --user daemon-reload && systemctl --user restart presonus-usb-watch.service
[Service]
Environment=PRESONUS_WATCH_RESET_AFTER=999999
