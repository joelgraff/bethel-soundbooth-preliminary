# Presonus FOH sink — StudioLive 32SX USB is fixed 64ch S32_LE @ 48k.
# Forcing 2ch fails open / renego; Pulse volume APIs also break above 32ch
# (channel volumes stick at 0%/-inf → silent FOH).
#
# soft-mixer + ignore-dB so gain is software; ensure-audio-routes sets
# 64× unity channelVolumes via pw-cli and links Mixer → AUX0/AUX1.
#
# Install:
#   cp → ~/.config/pipewire/pipewire.conf.d/presonus-foh.conf
#   WirePlumber 51-presonus-soft-mixer.lua disables stock ACP nodes
#   systemctl --user restart pipewire pipewire-pulse wireplumber

context.objects = [
    { factory = adapter
        args = {
            factory.name         = api.alsa.pcm.sink
            node.name            = "presonus-foh"
            node.description     = "Presonus FOH"
            node.nick            = "Presonus FOH"
            media.class          = "Audio/Sink"
            api.alsa.path        = "hw:S32SX,0"
            api.alsa.soft-mixer  = true
            api.alsa.ignore-dB   = true
            audio.channels       = 64
            audio.format         = "S32LE"
            audio.rate           = 48000
            # First pair = USB return 1–2 on the board
            audio.position       = "AUX0,AUX1,AUX2,AUX3,AUX4,AUX5,AUX6,AUX7,AUX8,AUX9,AUX10,AUX11,AUX12,AUX13,AUX14,AUX15,AUX16,AUX17,AUX18,AUX19,AUX20,AUX21,AUX22,AUX23,AUX24,AUX25,AUX26,AUX27,AUX28,AUX29,AUX30,AUX31,AUX32,AUX33,AUX34,AUX35,AUX36,AUX37,AUX38,AUX39,AUX40,AUX41,AUX42,AUX43,AUX44,AUX45,AUX46,AUX47,AUX48,AUX49,AUX50,AUX51,AUX52,AUX53,AUX54,AUX55,AUX56,AUX57,AUX58,AUX59,AUX60,AUX61,AUX62,AUX63"
            priority.driver      = 1500
            priority.session     = 1500
        }
    }
]
