# Virtual sinks for the soundbooth audio path (pipewire-pulse).
# Install: ~/.config/pipewire/pipewire-pulse.conf.d/virtual-controllers.conf
# Then: systemctl --user restart pipewire-pulse wireplumber
#
# Policy:
#   software apps → Mixer → Presonus (FOH)
#   VLC program audio → LocalLive → HDMI (sanctuary TV path)
# Removed (2026-07-12): unused "System" null sink (no links, always suspended).
#
# priority.session on Mixer keeps it preferred as the session default
# over motherboard analog / HDMI sinks.

pulse.cmd = [
  { cmd = "load-module" args = "module-null-sink sink_name=LocalLive sink_properties=device.description='Local Livestream' media.class=Audio/Sink channel_map=stereo" }
  { cmd = "load-module" args = "module-null-sink sink_name=Mixer sink_properties=device.description='Mixer audio controller' media.class=Audio/Sink channel_map=stereo priority.session=2000" }
]
