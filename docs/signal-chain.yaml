# Signal chain — structured source for the rendered diagrams on the dashboard's
# Reference Docs page (Graphviz -> SVG via dashboard/backend/app/signal_chain.py).
#
# THIS IS THE TOPOLOGY SOURCE OF TRUTH. docs/equipment-and-connections.md
# describes the same reality in prose; if the two disagree, one of them is
# wrong — fix both, don't fork them.
#
# status: confirmed        -> documented in SYSTEM-STATE.md / verified live
# status: needs-verification -> inferred or assumed; NOBODY HAS CHECKED THIS AT
#                            THE BOOTH. Renders dashed + faded so the diagram
#                            never presents a guess as fact. Same gaps listed
#                            in equipment-and-connections.md.
#
# Editing notes:
#   - link refs are "node.port" (or bare "node" for a node with no ports)
#   - direction: one-way (default arrow) | two-way (arrows both ends)
#   - kind: video | audio | control | network | power  -> sets edge color
#   - a port's side (left/right in LR, top/bottom in TB) is inferred from how
#     it's used; add `side: in|out|both` to a port only to override that, which
#     is occasionally needed for a two-way link between two adjacent nodes.
#   - port ORDER within a node is presentation: it decides which link leaves
#     above which, so list ports in the order their far ends appear.
#   - a GROUP is a component: the subject of one sheet. A group may declare
#     `subgroups`, and a node may name one in `subgroup`; these render as
#     nested boxes and are the ONLY reliable way to keep like equipment
#     together, because dot otherwise orders purely by signal-flow depth,
#     which interleaves monitors with infrastructure.
#   - a diagram may set `rankdir: TB|LR` to pick its own orientation.
#   - a diagram may set `kinds: [...]` to show only those link kinds; nodes
#     with no matching link drop out by themselves, and out-of-kind links are
#     dropped rather than drawn as off-sheet stubs. NO SHEET USES THIS TODAY
#     — it is what the short-lived video/audio/control split was built on. Kept
#     because the sheet model has already changed twice and this makes the
#     next change cheap; delete it if that stops being true.
#   - ports are drawn only where a link on that sheet lands on them, so a
#     device shows the connections relevant to the sheet you are reading.
#
# AFTER EDITING, run:
#     dashboard/backend/tests/signal-chain-layout-check.py
# It re-renders every sheet and fails if edge crossings, lines through node
# boxes, or lines cutting through their own node got worse. Grouping changes
# in particular can improve one sheet and wreck another; the numbers say
# which. Use --update-baseline once you have looked at the result and want to
# keep it.
diagrams:
  # ONE SHEET PER COMPONENT. Each sheet is a single piece of equipment plus
  # the accessories that hang off it; every cable that leaves for another
  # component stops at a labelled connector ("TO ATEM Mini Extreme / HDMI in
  # — Camera 3") and is picked up again on that component's own sheet.
  #
  # This replaced two earlier attempts. One combined booth sheet put 11 links
  # on the Booth PC and they crossed. Splitting by signal domain
  # (video/audio/control) un-crossed them, but it scattered one device's
  # cables across three drawings, so "what is plugged into the PC?" meant
  # reading all three. Per component that question is one sheet, and the hub
  # problem goes away because most far ends are connectors, not boxes.
  - id: pc
    title: Booth PC
    groups: [pc]
    # LR reads as a patch sheet: everything arriving from other components
    # down the left, the PC and its ports in the middle, what it drives on
    # the right. TB stacked the same content into two crossings.
    rankdir: LR
  - id: atem
    title: ATEM Mini Extreme
    groups: [atem]
    rankdir: TB
  - id: mixer
    title: PreSonus StudioLive 32SX
    groups: [mixer]
    rankdir: TB
  - id: stage
    title: Stage
    groups: [stage]
    # Columns, not rows: this sheet is a source -> infrastructure -> monitors
    # chain, and TB forces the monitor fan-out into a tall ragged staircase.
    rankdir: LR

groups:
  # A group is now a COMPONENT — the subject of one sheet — rather than a
  # physical zone. Subgroups carry the role distinction inside it.
  - id: pc
    label: Booth PC
    subgroups:
      - {id: dist, label: "HDMI distribution (pass-through)"}
      - {id: screens, label: "Displays (endpoints)"}
  - id: atem
    label: ATEM Mini Extreme
  - id: mixer
    label: PreSonus StudioLive 32SX
    subgroups:
      - {id: house, label: "House amplification"}
  - id: stage
    label: Stage
    # Split by ROLE, not by signal-flow depth. Without this the EarMixes come
    # out interleaved with the stageboxes and switches, because dot ranks by
    # hops-from-the-console and a monitor is the same distance out as a
    # stagebox. They are different things: monitors are endpoints a musician
    # touches, the switches and boxes are infrastructure nobody touches.
    subgroups:
      - {id: sources, label: "Sources (inputs)"}
      - {id: avb, label: "AVB infrastructure (pass-through)"}
      - {id: monitors, label: "Personal monitors (endpoints)"}
      # The camera is on stage physically but is video, not part of the audio
      # chain at all. Boxing it says so, and stops it being placed in the
      # middle of the AVB fan-out.
      - {id: cam, label: "Camera"}

nodes:
  # ---------------- Stage ----------------
  - id: stage_sources
    label: Stage mics / vocals
    group: stage
    subgroup: sources
    ports:
      - {id: out, label: XLR}

  - id: di_box
    label: Behringer DI (8ch)
    group: stage
    subgroup: sources
    ports:
      - {id: inst_in, label: Instrument in}
      - {id: out, label: XLR out}

  - id: td27
    label: Roland TD-27 (V-Drums)
    group: stage
    subgroup: sources
    ports:
      - {id: out, label: Out}

  # AVB network topology (operator, 2026-09-14). Two switches in series:
  # the console feeds the stage-right switch, which feeds the stage-left one.
  # "stage right/left" here is as stated by the operator, facing the stage.
  # The EarMixes are PoE-powered from the switches, and the first pair each
  # daisy-chain ("pass through") to a second unit rather than taking their
  # own switch port. Seven EarMixes total, which matches the count in
  # booth-context.md.
  - id: avb_switch_sr
    label: PreSonus SW5E — stage right
    group: stage
    subgroup: avb
    ports:
      # Port ORDER is presentation, not topology, and it decides which edge
      # leaves above which. Stagebox / to-stage-left / EarMix matches the
      # order those destinations end up in down the sheet; listing EarMix
      # before the stage-left uplink made those two edges cross immediately
      # outside the box for no reason at all.
      - {id: console, label: From console}
      - {id: box, label: Stagebox}
      - {id: sl, label: To stage-left switch}
      - {id: monitors, label: EarMix}

  - id: avb_switch_sl
    label: PreSonus SW5E — stage left
    group: stage
    subgroup: avb
    ports:
      - {id: uplink, label: From stage-right}
      - {id: box, label: Stagebox}
      - {id: monitors, label: EarMix}

  - id: nsb_right
    label: NSB 16.8 — stage right
    group: stage
    subgroup: avb
    ports:
      - {id: in, label: Mic/line in}
      - {id: avb, label: AVB}

  - id: nsb_left
    label: NSB 16.8 — stage left
    group: stage
    subgroup: avb
    ports:
      - {id: in, label: Mic/line in}
      - {id: avb, label: AVB}

  # EarMixes on the stage-right switch; each of these passes through to one
  # more unit rather than the second unit taking its own switch port.
  - id: em_jordan
    label: EarMix — Jordan
    group: stage
    subgroup: monitors
    ports:
      - {id: avb_in, label: AVB in}
      - {id: thru, label: AVB thru}

  - id: em_bassist
    label: EarMix — Bassist
    group: stage
    subgroup: monitors
    ports:
      - {id: avb_in, label: AVB in}
      - {id: thru, label: AVB thru}

  - id: em_keyboard
    label: EarMix — Keyboard
    group: stage
    subgroup: monitors
    ports:
      - {id: avb_in, label: AVB in}

  - id: em_drums
    label: EarMix — Drums
    group: stage
    subgroup: monitors
    ports:
      - {id: avb_in, label: AVB in}

  # EarMixes on the stage-left switch — three direct drops, no pass-through.
  - id: em_tom
    label: EarMix — Tom
    group: stage
    subgroup: monitors
    ports:
      - {id: avb_in, label: AVB in}

  - id: em_vocal1
    label: EarMix — Vocal 1
    group: stage
    subgroup: monitors
    ports:
      - {id: avb_in, label: AVB in}

  - id: em_vocal2
    label: EarMix — Vocal 2
    group: stage
    subgroup: monitors
    ports:
      - {id: avb_in, label: AVB in}

  - id: camera
    label: PTZOptics PT12X-SDI
    group: stage
    subgroup: cam
    ports:
      - {id: sdi_out, label: SDI Out}
      - {id: net, label: "LAN (VISCA/RTSP)"}

  # ---------------- Booth ----------------
  - id: presonus
    label: PreSonus StudioLive 32SX
    group: mixer
    ports:
      - {id: avb, label: AVB network}
      - {id: usb, label: "USB (64ch)", side: out}
      # No aux/monitor-send port modelled on purpose: the EarMixes are fed
      # over the AVB network via the switch, NOT from console aux outs. A
      # dangling "monitor sends" port here would imply the opposite.
      - {id: main_out, label: Main Out L/R}
      - {id: sub_out, label: Sub Out}
      # RESOLVED 2026-09-14: this was originally patched to channel 32 and was
      # later moved to 21. The repo's ch-32 references (lineout-fallback.service
      # and start-lineout-fallback.sh) were stale and have been corrected.
      - {id: ch21, label: "Ch 21 — PC line-out"}

  # The ATEM Mini Extreme's inputs are all HDMI — it has no SDI input at all,
  # which is why the SDI camera run goes through a converter first.
  - id: atem
    label: ATEM Mini Extreme
    group: atem
    ports:
      - {id: cam2, label: "HDMI in — Camera 2"}
      - {id: cam3, label: "HDMI in — Camera 3"}
      - {id: uvc_out, label: UVC / USB}
      - {id: eth, label: Ethernet (control), side: out}

  # NEEDS VERIFICATION: make/model, and whether it lives in the booth rack or
  # out at the camera. Placed in the booth here on the assumption the SDI coax
  # does the long run and conversion happens at the switcher end.
  - id: sdi_hdmi_conv
    label: SDI → HDMI converter
    group: atem
    ports:
      - {id: sdi_in, label: SDI in}
      - {id: hdmi_out, label: HDMI out}

  - id: pc
    label: Booth PC
    group: pc
    ports:
      - {id: video0, label: /dev/video0}
      - {id: usb_presonus, label: "USB → PreSonus"}
      - {id: lineout, label: Analog line-out}
      - {id: lan, label: LAN}
      - {id: dp1, label: DP-1}
      - {id: dp2, label: DP-2}
      - {id: dp3, label: DP-3}
      - {id: dp4, label: DP-4}

  - id: booth_monitor
    label: SAM S34CG50 (booth)
    group: pc
    ports:
      - {id: dp_in, label: DP in}

  # Three separate HDMI-over-Cat extenders plus the stage one (operator,
  # 2026-09-14) — not the single "multi-port hub" SYSTEM-STATE describes.
  # Each display group has its own unit, so an extender failure takes out one
  # group and leaves the others up.
  - id: ext_foh
    label: HDMI extender — 4-port (DP-2, FOH)
    group: pc
    subgroup: dist
    ports:
      - {id: hdmi_in, label: HDMI in}
      - {id: cat_out, label: Cat out}

  - id: ext_back
    label: HDMI extender — 4-port (DP-4, back)
    group: pc
    subgroup: dist
    ports:
      - {id: hdmi_in, label: HDMI in}
      - {id: cat_out, label: Cat out}

  - id: ext_pulpit
    label: HDMI extender — single (DP-3, pulpit)
    group: pc
    subgroup: dist
    ports:
      - {id: hdmi_in, label: HDMI in}
      - {id: cat_out, label: Cat out}

  # ---------------- FOH / house audio ----------------
  - id: crown
    label: Crown XLS202
    group: mixer
    subgroup: house
    ports:
      - {id: in, label: In}
      - {id: out, label: Speaker out}

  - id: peavey
    label: Peavey GPS 2600
    group: mixer
    subgroup: house
    ports:
      - {id: in, label: In}
      - {id: out, label: Speaker out}

  - id: bose
    label: Bose 251 (x8)
    group: mixer
    subgroup: house
    ports:
      - {id: in, label: "In (2 ch, mono each)"}   # quote anything containing a comma

  - id: sub
    label: Subwoofer
    group: mixer
    subgroup: house
    ports:
      - {id: in, label: In}

  # ---------------- Sanctuary ----------------
  # FOH = facing the congregation; BOH = facing the pulpit (a confidence feed
  # for whoever is speaking). Confirmed by the operator 2026-09-14.
  - id: foh_tvs
    label: FOH TVs — 2x 85in Sony Bravia
    group: pc
    subgroup: screens
    ports:
      - {id: hdmi_in, label: HDMI in}

  # One physical panel with two names in circulation: the operator's "pulpit
  # TV" and SYSTEM-STATE's "stage confidence monitor" are the same display —
  # back of house, facing forward so whoever is speaking can see FreeShow
  # Stage. It was modelled as two separate nodes until 2026-09-14.
  - id: boh_tv
    label: Pulpit TV / stage confidence monitor
    group: pc
    subgroup: screens
    ports:
      - {id: hdmi_in, label: HDMI in}

  # Outside the sanctuary proper (lobby/overflow). These are the "outside
  # monitors" SYSTEM-STATE mentions, and they carry the livestream content.
  # NEEDS VERIFICATION: whether they're on the same DP-4/GoFanco HDMI split as
  # the pulpit TV, or a separate device actually receiving the stream.
  - id: outside_tvs
    label: Outside TVs (x2) — livestream
    group: pc
    subgroup: screens
    ports:
      - {id: feed_in, label: Feed in}

  # ---------------- Maintenance ----------------
  - id: macbook
    label: MacBook
    group: atem
    ports:
      - {id: net, label: Wi-Fi}

links:
  # ---- Stage analog in ----
  # Mic/instrument patch deliberately not mapped yet (deferred 2026-09-14).
  # Which sources land on which box and which channels is the remaining gap —
  # see docs/mixer-channel-map.md when it exists.
  - {from: stage_sources.out, to: nsb_right.in, direction: one-way, kind: audio,
     label: "mic lines", status: needs-verification}
  - {from: di_box.out, to: nsb_right.in, direction: one-way, kind: audio,
     label: "DI", status: needs-verification}
  - {from: td27.out, to: nsb_left.in, direction: one-way, kind: audio,
     label: "drums", status: needs-verification}

  # ---- AVB network ----
  # Two-way throughout: each AVB link carries both directions on one cable —
  # box inputs up to the console, monitor mixes back down to the EarMixes.
  - {from: presonus.avb, to: avb_switch_sr.console, direction: two-way, kind: network,
     label: "AVB", status: confirmed}
  - {from: avb_switch_sr.box, to: nsb_right.avb, direction: two-way, kind: network,
     label: "AVB", status: confirmed}
  - {from: avb_switch_sr.sl, to: avb_switch_sl.uplink, direction: two-way, kind: network,
     label: "AVB", status: confirmed}
  - {from: avb_switch_sl.box, to: nsb_left.avb, direction: two-way, kind: network,
     label: "AVB", status: confirmed}

  # EarMixes on the stage-right switch, each daisy-chaining to a second unit.
  # Pairing confirmed by the operator 2026-09-14.
  - {from: avb_switch_sr.monitors, to: em_jordan.avb_in, direction: two-way, kind: network,
     label: "AVB + PoE", status: confirmed}
  - {from: avb_switch_sr.monitors, to: em_bassist.avb_in, direction: two-way, kind: network,
     label: "AVB + PoE", status: confirmed}
  - {from: em_jordan.thru, to: em_keyboard.avb_in, direction: two-way, kind: network,
     label: "AVB thru", status: confirmed}
  - {from: em_bassist.thru, to: em_drums.avb_in, direction: two-way, kind: network,
     label: "AVB thru", status: confirmed}

  # Three direct EarMix drops off the stage-left switch.
  - {from: avb_switch_sl.monitors, to: em_tom.avb_in, direction: two-way, kind: network,
     label: "AVB + PoE", status: confirmed}
  - {from: avb_switch_sl.monitors, to: em_vocal1.avb_in, direction: two-way, kind: network,
     label: "AVB + PoE", status: confirmed}
  - {from: avb_switch_sl.monitors, to: em_vocal2.avb_in, direction: two-way, kind: network,
     label: "AVB + PoE", status: confirmed}

  # ---- House audio out ----
  - {from: presonus.main_out, to: crown.in, direction: one-way, kind: audio,
     label: "house L/R", status: needs-verification}
  - {from: presonus.sub_out, to: peavey.in, direction: one-way, kind: audio,
     label: "sub feed", status: needs-verification}
  - {from: crown.out, to: bose.in, direction: one-way, kind: audio,
     label: "8 spk / 2 ch", status: needs-verification}
  - {from: peavey.out, to: sub.in, direction: one-way, kind: audio,
     status: needs-verification}

  # ---- Software audio return (SYSTEM-STATE: the live FOH path) ----
  # Carried by presonus-foh-bridge; this is the link whose USB end has the
  # failure history behind the ch 21 contingency below.
  - {from: presonus.usb, to: pc.usb_presonus, direction: two-way, kind: audio,
     label: "USB return 1–2", status: confirmed}
  # Second, independent PC->mixer path: the analog contingency feed
  # (lineout-fallback.service), deliberately sharing nothing with the USB link
  # so it can't fail the same way. Stays muted at the board until needed.
  - {from: pc.lineout, to: presonus.ch21, direction: one-way, kind: audio,
     label: "ch 21 (backup)", status: confirmed}

  # ---- Video / program ----
  - {from: camera.sdi_out, to: sdi_hdmi_conv.sdi_in, direction: one-way, kind: video,
     label: "SDI coax", status: confirmed}
  - {from: sdi_hdmi_conv.hdmi_out, to: atem.cam2, direction: one-way, kind: video,
     label: "HDMI", status: confirmed}
  # Labels here are kept to two or three words on purpose: dot reserves canvas
  # space for every edge label, so long ones physically push the nodes apart
  # and turn short links into long diagonals. The detail lives in these
  # comments and in docs/equipment-and-connections.md.
  #
  # UVC: a single-opener device — one process at a time holds /dev/video0.
  - {from: atem.uvc_out, to: pc.video0, direction: one-way, kind: video,
     label: "UVC", status: confirmed}
  # ATEM control lives in atem.conf.
  - {from: atem.eth, to: pc.lan, direction: two-way, kind: control,
     label: "control", status: confirmed}
  # VISCA (pan/tilt/zoom) and RTSP (preview stream), both in camera.conf. The
  # camera sits on its OWN subnet, not the booth LAN — that separation is not
  # recorded anywhere else, so do not drop it from here.
  - {from: camera.net, to: pc.lan, direction: two-way, kind: control,
     label: "VISCA / RTSP", status: confirmed}

  # ---- Displays ----
  - {from: pc.dp1, to: booth_monitor.dp_in, direction: one-way, kind: video,
     label: "direct", status: confirmed}
  # Confirmed 2026-09-14, and it accounts for all four GPU outputs exactly:
  # DP-1 is the booth ultrawide (direct, no extender) and DP-2/3/4 each drive
  # one extender. Each display panel is one output of its extender.
  - {from: pc.dp2, to: ext_foh.hdmi_in, direction: one-way, kind: video,
     label: "FreeShow Primary", status: confirmed}
  # 4-port extender, 2 ports in use — one per Bravia, 2 spare.
  - {from: ext_foh.cat_out, to: foh_tvs.hdmi_in, direction: one-way, kind: video,
     label: "Cat", status: confirmed}
  - {from: pc.dp3, to: ext_pulpit.hdmi_in, direction: one-way, kind: video,
     label: "FreeShow Stage", status: confirmed}
  - {from: ext_pulpit.cat_out, to: boh_tv.hdmi_in, direction: one-way, kind: video,
     label: "Cat", status: confirmed}
  - {from: pc.dp4, to: ext_back.hdmi_in, direction: one-way, kind: video,
     label: "program", status: confirmed}
  - {from: ext_back.cat_out, to: outside_tvs.feed_in, direction: one-way, kind: video,
     label: "Cat ~200 ft", status: confirmed}
  # The DP-2 feed doesn't only go out to the front TVs — it also comes back
  # into the ATEM on Camera 3, so FreeShow Primary can be switched into the
  # program feed (slides/lower-thirds to the stream and the back TVs).
  # NEEDS VERIFICATION: where it's tapped — a splitter off DP-2 before the
  # GoFanco hub, or a spare output on the hub itself.
  - {from: pc.dp2, to: atem.cam3, direction: one-way, kind: video,
     label: "FreeShow Primary", status: confirmed, constraint: false}

  # ---- Maintenance workstation (never in the operational path) ----
  # Wi-Fi only — the MacBook has no USB connection to anything, which also
  # means it can't contend for /dev/video0 with ffmpeg-capture (the risk
  # flagged in STATUS.md 2026-09-14). It reaches exactly two things:
  - {from: macbook.net, to: atem.eth, direction: two-way, kind: control,
     label: "ATEM Control", status: confirmed}
  - {from: macbook.net, to: pc.lan, direction: two-way, kind: control,
     label: "dashboard", status: confirmed}
