# Signal chain — structured source for the rendered diagrams on the dashboard's
# Reference Docs page (Graphviz -> SVG via dashboard/backend/app/signal_chain.py).
#
# THIS IS THE TOPOLOGY SOURCE OF TRUTH. docs/equipment-and-connections.md
# describes the same reality in prose; if the two disagree, one of them is
# wrong — fix both, don't fork them.
#
# status: confirmed        -> documented in SYSTEM-STATE.md / verified live
# status: needs-verification -> inferred or assumed; NOBODY HAS CHECKED THIS AT
#                            THE BOOTH. Renders dashed + faded so the diagram
#                            never presents a guess as fact. Same gaps listed
#                            in equipment-and-connections.md.
#
# Editing notes:
#   - link refs are "node.port" (or bare "node" for a node with no ports)
#   - direction: one-way (default arrow) | two-way (arrows both ends)
#   - kind: video | audio | control | network | power  -> sets edge color
#   - a port's side (left/right in LR, top/bottom in TB) is inferred from how
#     it's used; add `side: in|out|both` to a port only to override that, which
#     is occasionally needed for a two-way link between two adjacent nodes.

diagrams:
  - id: stage
    title: Stage
    groups: [stage]
  - id: booth
    title: Sound Booth
    groups: [booth, foh, sanctuary, maintenance]

groups:
  - id: stage
    label: Stage
  - id: booth
    label: Booth (rack + PC)
  - id: foh
    label: FOH / House Audio
  - id: sanctuary
    label: Sanctuary
  - id: maintenance
    label: Maintenance (non-operational)

nodes:
  # ---------------- Stage ----------------
  - id: stage_sources
    label: Stage mics / vocals
    group: stage
    ports:
      - {id: out, label: XLR}

  - id: di_box
    label: Behringer DI (8ch)
    group: stage
    ports:
      - {id: inst_in, label: Instrument in}
      - {id: out, label: XLR out}

  - id: td27
    label: Roland TD-27 (V-Drums)
    group: stage
    ports:
      - {id: out, label: Out}

  # AVB network topology (operator, 2026-09-14). Two switches in series:
  # the console feeds the stage-right switch, which feeds the stage-left one.
  # "stage right/left" here is as stated by the operator, facing the stage.
  # The EarMixes are PoE-powered from the switches, and the first pair each
  # daisy-chain ("pass through") to a second unit rather than taking their
  # own switch port. Seven EarMixes total, which matches the count in
  # booth-context.md.
  - id: avb_switch_sr
    label: AVB switch — stage right
    group: stage
    ports:
      - {id: console, label: From console}
      - {id: box, label: Stagebox}
      - {id: monitors, label: EarMix}
      - {id: sl, label: To stage-left switch}

  - id: avb_switch_sl
    label: AVB switch — stage left
    group: stage
    ports:
      - {id: uplink, label: From stage-right}
      - {id: box, label: Stagebox}
      - {id: monitors, label: EarMix}

  - id: nsb_right
    label: NSB 16.8 — stage right
    group: stage
    ports:
      - {id: in, label: Mic/line in}
      - {id: avb, label: AVB}

  - id: nsb_left
    label: NSB 16.8 — stage left
    group: stage
    ports:
      - {id: in, label: Mic/line in}
      - {id: avb, label: AVB}

  # EarMixes on the stage-right switch; each of these passes through to one
  # more unit rather than the second unit taking its own switch port.
  - id: em_jordan
    label: EarMix — Jordan
    group: stage
    ports:
      - {id: avb_in, label: AVB in}
      - {id: thru, label: AVB thru}

  - id: em_bassist
    label: EarMix — Bassist
    group: stage
    ports:
      - {id: avb_in, label: AVB in}
      - {id: thru, label: AVB thru}

  - id: em_keyboard
    label: EarMix — Keyboard
    group: stage
    ports:
      - {id: avb_in, label: AVB in}

  - id: em_drums
    label: EarMix — Drums
    group: stage
    ports:
      - {id: avb_in, label: AVB in}

  # EarMixes on the stage-left switch — three direct drops, no pass-through.
  - id: em_tom
    label: EarMix — Tom
    group: stage
    ports:
      - {id: avb_in, label: AVB in}

  - id: em_vocal1
    label: EarMix — Vocal 1
    group: stage
    ports:
      - {id: avb_in, label: AVB in}

  - id: em_vocal2
    label: EarMix — Vocal 2
    group: stage
    ports:
      - {id: avb_in, label: AVB in}

  - id: camera
    label: PTZOptics PT12X-SDI
    group: stage
    ports:
      - {id: sdi_out, label: SDI Out}
      - {id: net, label: "LAN (VISCA/RTSP)"}

  - id: stage_monitor
    label: Stage confidence monitor
    group: stage
    ports:
      - {id: hdmi_in, label: HDMI in}

  # ---------------- Booth ----------------
  - id: presonus
    label: PreSonus StudioLive 32SX
    group: booth
    ports:
      - {id: avb, label: AVB network}
      - {id: usb, label: "USB (64ch)", side: out}
      # No aux/monitor-send port modelled on purpose: the EarMixes are fed
      # over the AVB network via the switch, NOT from console aux outs. A
      # dangling "monitor sends" port here would imply the opposite.
      - {id: main_out, label: Main Out L/R}
      - {id: sub_out, label: Sub Out}
      # RESOLVED 2026-09-14: this was originally patched to channel 32 and was
      # later moved to 21. The repo's ch-32 references (lineout-fallback.service
      # and start-lineout-fallback.sh) were stale and have been corrected.
      - {id: ch21, label: "Ch 21 — PC line-out"}

  # The ATEM Mini Extreme's inputs are all HDMI — it has no SDI input at all,
  # which is why the SDI camera run goes through a converter first.
  - id: atem
    label: ATEM Mini Extreme
    group: booth
    ports:
      - {id: cam2, label: "HDMI in — Camera 2"}
      - {id: cam3, label: "HDMI in — Camera 3"}
      - {id: uvc_out, label: UVC / USB}
      - {id: eth, label: Ethernet (control), side: out}

  # NEEDS VERIFICATION: make/model, and whether it lives in the booth rack or
  # out at the camera. Placed in the booth here on the assumption the SDI coax
  # does the long run and conversion happens at the switcher end.
  - id: sdi_hdmi_conv
    label: SDI → HDMI converter
    group: booth
    ports:
      - {id: sdi_in, label: SDI in}
      - {id: hdmi_out, label: HDMI out}

  - id: pc
    label: Booth PC
    group: booth
    ports:
      - {id: video0, label: /dev/video0}
      - {id: usb_presonus, label: "USB → PreSonus"}
      - {id: lineout, label: Analog line-out}
      - {id: lan, label: LAN}
      - {id: dp1, label: DP-1}
      - {id: dp2, label: DP-2}
      - {id: dp3, label: DP-3}
      - {id: dp4, label: DP-4}

  - id: booth_monitor
    label: SAM S34CG50 (booth)
    group: booth
    ports:
      - {id: dp_in, label: DP in}

  - id: gofanco_hub
    label: GoFanco HDMI-over-Cat (hub)
    group: booth
    ports:
      - {id: hdmi_in, label: HDMI in}
      - {id: cat_out, label: Cat out}

  - id: gofanco_stage_tx
    label: GoFanco stage TX
    group: booth
    ports:
      - {id: hdmi_in, label: HDMI in}
      - {id: cat_out, label: Cat out}

  # ---------------- FOH / house audio ----------------
  - id: crown
    label: Crown XLS202
    group: foh
    ports:
      - {id: in, label: In}
      - {id: out, label: Speaker out}

  - id: peavey
    label: Peavey GPS 2600
    group: foh
    ports:
      - {id: in, label: In}
      - {id: out, label: Speaker out}

  - id: bose
    label: Bose 251 (x8)
    group: foh
    ports:
      - {id: in, label: "In (2 ch, mono each)"}   # quote anything containing a comma

  - id: sub
    label: Subwoofer
    group: foh
    ports:
      - {id: in, label: In}

  # ---------------- Sanctuary ----------------
  # FOH = facing the congregation; BOH = facing the pulpit (a confidence feed
  # for whoever is speaking). Confirmed by the operator 2026-09-14.
  - id: foh_tvs
    label: FOH TVs — 2x 85in Sony Bravia
    group: sanctuary
    ports:
      - {id: hdmi_in, label: HDMI in}

  - id: boh_tv
    label: BOH TV (faces the pulpit)
    group: sanctuary
    ports:
      - {id: hdmi_in, label: HDMI in}

  # Outside the sanctuary proper (lobby/overflow). These are the "outside
  # monitors" SYSTEM-STATE mentions, and they carry the livestream content.
  # NEEDS VERIFICATION: whether they're on the same DP-4/GoFanco HDMI split as
  # the pulpit TV, or a separate device actually receiving the stream.
  - id: outside_tvs
    label: Outside TVs (x2) — livestream
    group: sanctuary
    ports:
      - {id: feed_in, label: Feed in}

  # ---------------- Maintenance ----------------
  - id: macbook
    label: MacBook
    group: maintenance
    ports:
      - {id: net, label: Wi-Fi}

links:
  # ---- Stage analog in ----
  # Mic/instrument patch deliberately not mapped yet (deferred 2026-09-14).
  # Which sources land on which box and which channels is the remaining gap —
  # see docs/mixer-channel-map.md when it exists.
  - {from: stage_sources.out, to: nsb_right.in, direction: one-way, kind: audio,
     label: "mic lines — box/channel not yet mapped", status: needs-verification}
  - {from: di_box.out, to: nsb_right.in, direction: one-way, kind: audio,
     label: "DI'd instruments — not yet mapped", status: needs-verification}
  - {from: td27.out, to: nsb_left.in, direction: one-way, kind: audio,
     label: "drum module — not yet mapped", status: needs-verification}

  # ---- AVB network ----
  # Two-way throughout: each AVB link carries both directions on one cable —
  # box inputs up to the console, monitor mixes back down to the EarMixes.
  - {from: presonus.avb, to: avb_switch_sr.console, direction: two-way, kind: network,
     label: "AVB — console to stage-right switch", status: confirmed}
  - {from: avb_switch_sr.box, to: nsb_right.avb, direction: two-way, kind: network,
     label: "AVB", status: confirmed}
  - {from: avb_switch_sr.sl, to: avb_switch_sl.uplink, direction: two-way, kind: network,
     label: "AVB — switch to switch", status: confirmed}
  - {from: avb_switch_sl.box, to: nsb_left.avb, direction: two-way, kind: network,
     label: "AVB", status: confirmed}

  # EarMixes on the stage-right switch, each daisy-chaining to a second unit.
  # NEEDS VERIFICATION: the pairing — whether Jordan feeds Keyboard and
  # Bassist feeds Drums, or the other way round.
  - {from: avb_switch_sr.monitors, to: em_jordan.avb_in, direction: two-way, kind: network,
     label: "AVB + PoE", status: confirmed}
  - {from: avb_switch_sr.monitors, to: em_bassist.avb_in, direction: two-way, kind: network,
     label: "AVB + PoE", status: confirmed}
  - {from: em_jordan.thru, to: em_keyboard.avb_in, direction: two-way, kind: network,
     label: "thru — pairing unconfirmed", status: needs-verification}
  - {from: em_bassist.thru, to: em_drums.avb_in, direction: two-way, kind: network,
     label: "thru — pairing unconfirmed", status: needs-verification}

  # Three direct EarMix drops off the stage-left switch.
  - {from: avb_switch_sl.monitors, to: em_tom.avb_in, direction: two-way, kind: network,
     label: "AVB + PoE", status: confirmed}
  - {from: avb_switch_sl.monitors, to: em_vocal1.avb_in, direction: two-way, kind: network,
     label: "AVB + PoE", status: confirmed}
  - {from: avb_switch_sl.monitors, to: em_vocal2.avb_in, direction: two-way, kind: network,
     label: "AVB + PoE", status: confirmed}

  # ---- House audio out ----
  - {from: presonus.main_out, to: crown.in, direction: one-way, kind: audio,
     label: "house L/R", status: needs-verification}
  - {from: presonus.sub_out, to: peavey.in, direction: one-way, kind: audio,
     label: "sub feed", status: needs-verification}
  - {from: crown.out, to: bose.in, direction: one-way, kind: audio,
     label: "8 speakers / 2 ch", status: needs-verification}
  - {from: peavey.out, to: sub.in, direction: one-way, kind: audio,
     status: needs-verification}

  # ---- Software audio return (SYSTEM-STATE: the live FOH path) ----
  - {from: presonus.usb, to: pc.usb_presonus, direction: two-way, kind: audio,
     label: "USB return 1-2 via presonus-foh-bridge", status: confirmed}
  # Second, independent PC->mixer path: the analog contingency feed
  # (lineout-fallback.service), deliberately sharing nothing with the USB link
  # so it can't fail the same way. Stays muted at the board until needed.
  - {from: pc.lineout, to: presonus.ch21, direction: one-way, kind: audio,
     label: "analog line-out → ch 21 (FOH contingency)", status: confirmed}

  # ---- Video / program ----
  - {from: camera.sdi_out, to: sdi_hdmi_conv.sdi_in, direction: one-way, kind: video,
     label: "SDI coax", status: confirmed}
  - {from: sdi_hdmi_conv.hdmi_out, to: atem.cam2, direction: one-way, kind: video,
     label: "HDMI → Camera 2", status: confirmed}
  - {from: atem.uvc_out, to: pc.video0, direction: one-way, kind: video,
     label: "UVC — single opener", status: confirmed}
  - {from: atem.eth, to: pc.lan, direction: two-way, kind: control,
     label: "control (atem.conf)", status: confirmed}
  - {from: camera.net, to: pc.lan, direction: two-way, kind: control,
     label: "VISCA / RTSP (camera.conf, separate subnet)", status: confirmed}

  # ---- Displays ----
  - {from: pc.dp1, to: booth_monitor.dp_in, direction: one-way, kind: video,
     label: "direct", status: confirmed}
  - {from: pc.dp2, to: gofanco_hub.hdmi_in, direction: one-way, kind: video,
     label: "FreeShow Primary", status: confirmed}
  - {from: pc.dp4, to: gofanco_hub.hdmi_in, direction: one-way, kind: video,
     label: "program (ffplay)", status: confirmed}
  - {from: pc.dp3, to: gofanco_stage_tx.hdmi_in, direction: one-way, kind: video,
     label: "FreeShow Stage", status: confirmed}
  - {from: gofanco_hub.cat_out, to: foh_tvs.hdmi_in, direction: one-way, kind: video,
     label: "Cat — which TX/RX pair?", status: needs-verification}
  - {from: gofanco_hub.cat_out, to: boh_tv.hdmi_in, direction: one-way, kind: video,
     label: "Cat, up to ~200 ft — program feed", status: needs-verification}
  - {from: gofanco_hub.cat_out, to: outside_tvs.feed_in, direction: one-way, kind: video,
     label: "livestream content — same HDMI split, or a stream receiver?",
     status: needs-verification}
  # The DP-2 feed doesn't only go out to the front TVs — it also comes back
  # into the ATEM on Camera 3, so FreeShow Primary can be switched into the
  # program feed (slides/lower-thirds to the stream and the back TVs).
  # NEEDS VERIFICATION: where it's tapped — a splitter off DP-2 before the
  # GoFanco hub, or a spare output on the hub itself.
  - {from: pc.dp2, to: atem.cam3, direction: one-way, kind: video,
     label: "same feed as the front TVs → Camera 3", status: confirmed}
  - {from: gofanco_stage_tx.cat_out, to: stage_monitor.hdmi_in, direction: one-way, kind: video,
     label: "Cat to stage", status: needs-verification}

  # ---- Maintenance workstation (never in the operational path) ----
  # Wi-Fi only — the MacBook has no USB connection to anything, which also
  # means it can't contend for /dev/video0 with ffmpeg-capture (the risk
  # flagged in STATUS.md 2026-09-14). It reaches exactly two things:
  - {from: macbook.net, to: atem.eth, direction: two-way, kind: control,
     label: "Wi-Fi — ATEM Software Control", status: confirmed}
  - {from: macbook.net, to: pc.lan, direction: two-way, kind: control,
     label: "Wi-Fi — web dashboard", status: confirmed}
